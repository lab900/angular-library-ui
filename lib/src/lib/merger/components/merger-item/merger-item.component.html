<div
  class="lab900-merger-item"
  [class.selected]="active()"
  [style.flex-direction]="flexDirection()"
  [style.align-items]="config().nextLine ? '' : 'center'"
  [style.justify-content]="config().nextLine ? '' : 'space-between'">
  @if (!config().component) {
    @for (nested of nestedValues(); track nested.attribute) {
      <div class="lab900-merger-item__sub">
        <p>{{ nested.label | translate }}</p>
        <span>{{ nested.value | async | translate }}</span>
      </div>
    } @empty {
      @if (config().label; as label) {
        <p>{{ label | translate }}</p>
      }
      <span style="text-align: right">{{ value() | async | translate }}</span>
    }
  } @else {
    <ng-container #customComponentContainer />
  }
</div>
