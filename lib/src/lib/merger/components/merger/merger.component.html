<div class="lab900-merger">
  @if (showLoading()) {
    <mat-progress-bar mode="indeterminate" />
  } @else {
    <div class="lab900-merger__row">
      <div [class.selected]="selectedSide() === 'left'" class="lab900-merger__row__header">
        <h2>{{ leftObject().title }}</h2>
        <mat-radio-button
          (change)="switchMaster()"
          [checked]="selectedSide() === 'left'"
          [disabled]="fixed()"
          color="primary" />
      </div>
      <div [class.selected]="selectedSide() === 'right'" class="lab900-merger__row__header">
        <h2>{{ rightObject().title }}</h2>
        <mat-radio-button
          (change)="switchMaster()"
          [checked]="selectedSide() === 'right'"
          [disabled]="fixed()"
          color="primary" />
      </div>
    </div>
    @for (row of rows(); track row.index) {
      <div class="lab900-merger__row" [class]="row.config.rowClass">
        <lab900-merger-item [active]="selectedSide() === 'left'" [config]="row.config" [data]="leftData()" />
        <div class="lab900-merger__row__icon">
          <button
            mat-icon-button
            [disableRipple]="true"
            (click)="toggleActive(row.index)"
            [disabled]="!!row.config.disabled">
            @if (row.different) {
              <mat-icon
                [class.not-active]="!row.config.active"
                [class.flip]="selectedSide() !== 'right'"
                color="primary"
                >trending_flat
              </mat-icon>
            }
            @if (row.config.combine) {
              <mat-icon
                [class.not-active]="!row.config.active"
                [class.flip]="selectedSide() !== 'right'"
                color="primary"
                svgIcon="merge" />
            }
          </button>
        </div>
        <lab900-merger-item [active]="selectedSide() === 'right'" [config]="row.config" [data]="rightData()" />
      </div>
    }
  }
</div>
