<mat-dialog-content>
  <p>{{ message | translate }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-raised-button mat-dialog-close>{{ cancelButtonText | translate }}</button>
  <!-- the dialog focuses the confirm button when it opens -->
  <button mat-raised-button color="primary" (click)="onConfirmClick()" cdkFocusInitial>
    {{ confirmButtonText | translate }}
  </button>
</mat-dialog-actions>
